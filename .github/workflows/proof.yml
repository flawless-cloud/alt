# Throwaway deployment of the proof step (plan R3; restricted-networks design 6.9), written into
# flawless-cloud/alt by infra/github. It publishes what proof/build.sh builds: the 24 test pages
# and the measurement files, or, once the cleanup has removed proof/page.html, a bare not-found
# page. The mirror workflow replaces it in R5. Holds no secrets; actions pinned by commit.
name: proof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the test site
        run: bash proof/build.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
